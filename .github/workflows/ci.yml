# =============================================================================
# CI Template: Public TypeScript MCP Server (workspace, better-email-mcp, etc.)
# Source: https://github.com/n24q02m/.github/templates/ci/public-typescript.yml
#
# Runner strategy: lint, test and build run on ubuntu, windows and macOS so the
# coverage gate holds on every desktop OS; every other job runs on ubuntu-latest.
# CUSTOMIZE: Search for "# CUSTOMIZE:" comments and adjust for your repo.
# =============================================================================
name: CI

on:
  # Public repo (spec 2026-10-30): ci.yml may also start by itself, because Actions minutes
  # are free on a public repo. cd.yml stays dispatch-only on every repo. ci_policy_lint.py
  # allows these triggers in ci.yml of a public repo only. `sha` is read by the
  # main-integrity job only.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit for the main-integrity job to verify (default: the tip of the dispatched ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Validate PR title (Conventional Commits subset)
  # ============================================================================
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix:. This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  # ============================================================================
  # Lint, Test & Build (TypeScript/Bun)
  # ============================================================================
  lint-and-test:
    name: Lint, Test & Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["26"]
        include:
          - os: ubuntu-latest
            node-version: "22"
          - os: ubuntu-latest
            node-version: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # The Codecov upload authenticates with this job's OIDC token.
      id-token: write
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
      - name: Test SessionStart hook
        run: |
          python -m pip install pytest==9.0.3
          python -m pytest hooks/tests -q
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify Node LTS row
        run: node -e "const v = process.versions.node.split('.')[0]; if (v !== '${{ matrix.node-version }}') throw new Error('Expected Node ' + '${{ matrix.node-version }}' + ', got ' + process.versions.node)"

      - run: bun install --frozen-lockfile
      - run: bun run check
      # Build BEFORE test: tests/protocol/m1-stdio.test.ts spawns the built
      # bin/cli.mjs over the real MCP stdio transport, so it must exist
      # before `bun run test` runs (a fresh CI checkout has no bin/ -- it's
      # gitignored, produced only by this build step).
      - run: bun run build
      # test:coverage = `vitest --coverage`; enforces vitest.config.ts's
      # coverage.thresholds, so a coverage regression fails this step.
      - name: Run tests with coverage
        run: bun run test:coverage
      # Codecov refuses a tokenless upload for the default branch, and no upload token
      # is stored, so the upload authenticates with OIDC and fails the job when Codecov
      # refuses it. Pull requests skip it: a fork or Dependabot run cannot always mint
      # an OIDC token, and the required check must not depend on Codecov being reachable.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '26'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # CUSTOMIZE: Coverage file path
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true

  # ============================================================================
  # Dependency Review
  # ============================================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  lint-and-test-summary:
    name: Lint, Test & Build (ubuntu-latest)
    needs: [lint-and-test]
    if: always() && needs.lint-and-test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
      - name: Assert matrix result
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "lint-and-test matrix result: ${{ needs.lint-and-test.result }}"
            exit 1
          fi
