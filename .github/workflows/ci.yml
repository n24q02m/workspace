# =============================================================================
# CI Template: Public TypeScript MCP Server (workspace, better-email-mcp, etc.)
# Source: https://github.com/n24q02m/.github/templates/ci/public-typescript.yml
#
# Runner strategy: ubuntu-latest for ALL jobs, harden-runner everywhere.
# CUSTOMIZE: Search for "# CUSTOMIZE:" comments and adjust for your repo.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # Lint, Test & Build (TypeScript/Bun)
  # ============================================================================
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
      - name: Test SessionStart hook
        run: |
          python -m pip install pytest==9.0.3
          python -m pytest hooks/tests -q
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile
      - run: bun run check
      # Build BEFORE test: tests/protocol/m1-stdio.test.ts spawns the built
      # bin/cli.mjs over the real MCP stdio transport, so it must exist
      # before `bun run test` runs (a fresh CI checkout has no bin/ -- it's
      # gitignored, produced only by this build step).
      - run: bun run build
      # test:coverage = `vitest --coverage`; enforces vitest.config.ts's
      # coverage.thresholds, so a coverage regression fails this step.
      - name: Run tests with coverage
        run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # CUSTOMIZE: Coverage file path
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Dependency Review
  # ============================================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
