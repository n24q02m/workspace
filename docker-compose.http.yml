# HTTP mode overlay - use with:
#   docker compose -f docker-compose.yml -f docker-compose.http.yml up
services:
  workspace:
    build:
      target: http
    environment:
      - MCP_TRANSPORT=http
      # The WEB OAuth client, renamed on the way in: Google binds redirect URIs
      # to the client TYPE, so http needs a Web client while stdio needs a
      # Desktop one. Keeping the two under distinct names is what stops an http
      # deploy from overwriting the credentials every stdio install runs on.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_WEB_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_WEB_CLIENT_SECRET}
      # Refused at startup if unset: per-user credential stores derive their
      # encryption key from it.
      - CREDENTIAL_SECRET=${CREDENTIAL_SECRET}
      # Users file for the per-user bearer table (hull `multi` auth). Must be a
      # path inside the container; mount the file in yourself. Unset falls back to
      # hull's default location.
      - WORKSPACE_USERS_FILE=${WORKSPACE_USERS_FILE}
      # The server binds loopback by default, which is unreachable from outside
      # the container.
      - HOST=0.0.0.0
      - PORT=8080
    # Next free port in the stack (notion+telegram 8081, email 8082, imagine 8084,
    # wet 8085, mnemo 8086). The assignments are a convention, not a registry.
    # Published on host loopback only: reach it as http://localhost:8087, or put
    # your own TLS reverse proxy on the same host in front of it.
    ports:
      - "127.0.0.1:8087:8080"
